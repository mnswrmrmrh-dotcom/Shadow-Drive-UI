<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥷 Shadow Drive - مستودع الظل</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- شريط العلوي -->
    <div class="navbar">
        <div class="logo"><i class="fas fa-cloud-upload-alt" style="color: #ff0055;"></i> Shadow Drive</div>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="بحث..." onkeyup="searchFiles()">
        </div>
        <div class="user-actions"><button onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button></div>
    </div>

    <!-- شريط الأدوات -->
    <div class="toolbar">
        <div class="left"><span id="currentPath">📂 الجذر</span></div>
        <div class="right">
            <button onclick="createFolder()"><i class="fas fa-folder-plus"></i> مجلد</button>
            <button onclick="document.getElementById('fileUpload').click()"><i class="fas fa-upload"></i> رفع</button>
            <input type="file" id="fileUpload" multiple style="display:none" onchange="handleUploadInput(this.files)">
            <button onclick="refreshFiles()"><i class="fas fa-sync-alt"></i></button>
        </div>
    </div>

    <!-- منطقة السحب والإفلات -->
    <div id="dropZone" class="drop-zone">
        <i class="fas fa-cloud-upload-alt"></i>
        <p>اسحب ملفاتك أو صورك هنا</p>
        <span style="font-size:12px;color:#666;">(سيتم رفع الملفات إلى Drive الخاص بك)</span>
    </div>

    <!-- منطقة معاينة الصور -->
    <div id="previewContainer" class="preview-grid"></div>

    <!-- شبكة الملفات الرئيسية -->
    <div id="fileGrid" class="file-grid"><div class="loading">⏳ جاري التحميل...</div></div>

    <script src="script.js"></script>
</body>
</html>
